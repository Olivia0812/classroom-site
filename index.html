  --shadow: 0 10px 22px -12px rgba(59,42,31,.45);
  --shadow-lift: 0 18px 30px -14px rgba(59,42,31,.55);
}

*{box-sizing:border-box;}
body{
  margin:0;
  color:var(--ink);
  background:
    radial-gradient(circle at 1px 1px, var(--bg-fiber) 1px, transparent 1.4px) 0 0/14px 14px,
    var(--bg);
  font-family: "PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,-apple-system,sans-serif;
  line-height:1.6;
}
.board{
  max-width:980px;
  margin:0 auto;
  padding:2.5rem 1.25rem 4rem;
}

.eyebrow{
  font-size:.72rem;
  letter-spacing:.14em;
  color:var(--ink-soft);
  margin:0 0 .35rem;
  text-transform:uppercase;
}
.eyebrow-coral{color:var(--coral)}
.eyebrow-mustard{color:var(--mustard)}
.eyebrow-sky{color:var(--sky)}
.eyebrow-sage{color:var(--sage)}
.eyebrow-lavender{color:var(--lavender)}

/* ---------- nameplate ---------- */
.nameplate{
  position:relative;
  background:var(--surface);
  border-radius:2px;
  padding:1.8rem 2rem 1.6rem;
  text-align:center;
  box-shadow:var(--shadow);
  margin-bottom:1.75rem;
  clip-path: polygon(0% 1.5%, 4% 0%, 96% 0.5%, 100% 2%, 99.5% 97%, 95% 100%, 5% 99.3%, 0.5% 96%);
}
.nameplate h1{
  margin:.1rem 0 .5rem;
  font-size:clamp(1.5rem,4vw,2.15rem);
  font-weight:800;
  letter-spacing:.02em;
  text-wrap:balance;
}
.nameplate .blank{
  border-bottom:3px solid var(--pine);
  padding:0 .15em;
}
.tagline{
  margin:0;
  color:var(--ink-soft);
  font-size:.95rem;
}
.tape{
  position:absolute;
  top:-14px;
  width:76px;
  height:28px;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 6px, rgba(255,255,255,.12) 6px 12px), var(--mustard);
  opacity:.85;
  box-shadow:0 3px 6px rgba(0,0,0,.18);
}
.tape-l{ left:8%; transform:rotate(-8deg); }
.tape-r{ right:8%; transform:rotate(7deg); background:repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 6px, rgba(255,255,255,.12) 6px 12px), var(--sky); }

/* ---------- stat strip ---------- */
.stat-strip{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:.9rem;
  margin-bottom:2rem;
}
.chip{
  font:inherit;
  text-align:left;
  cursor:pointer;
  border:none;
  border-radius:2px;
  padding:.85rem 1rem;
  color:var(--ink);
  background:var(--surface-2);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:.2rem;
  transition:transform .15s ease;
}
.chip:hover{ transform:translateY(-2px); }
.chip:focus-visible{ outline:3px solid var(--ring); outline-offset:2px; }
.chip-label{ font-size:.72rem; letter-spacing:.08em; color:var(--ink-soft); text-transform:uppercase;}
.chip-value{ font-weight:700; font-size:.98rem; }
.chip-mustard{ border-left:6px solid var(--mustard); }
.chip-sage{ border-left:6px solid var(--sage); }
.chip-coral{ border-left:6px solid var(--coral); }

/* ---------- card grid ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:1.6rem 1.3rem;
  margin-bottom:1rem;
}
.card{
  position:relative;
  font:inherit;
  text-align:left;
  cursor:pointer;
  border:none;
  background:var(--surface);
  border-radius:2px;
  padding:1.5rem 1.2rem 1.3rem;
  color:var(--ink);
  box-shadow:var(--shadow);
  transform:rotate(var(--tilt,0deg));
  transition:transform .18s ease, box-shadow .18s ease;
  clip-path: polygon(0 2%, 3% 0, 97% 0.6%, 100% 3%, 99% 98%, 96% 100%, 4% 99.4%, 1% 97%);
}
.card::before{
  content:"";
  position:absolute;
  top:-10px; left:50%;
  width:52px; height:20px;
  transform:translateX(-50%) rotate(-3deg);
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.35) 0 5px, rgba(255,255,255,.1) 5px 10px), var(--accent);
  opacity:.8;
}
.card:hover, .card:focus-visible{
  transform:rotate(0deg) translateY(-4px) scale(1.015);
  box-shadow:var(--shadow-lift);
}
.card:focus-visible{ outline:3px solid var(--ring); outline-offset:3px; }
.card[aria-expanded="true"]{
  transform:rotate(0deg) translateY(-4px) scale(1.015);
  box-shadow:var(--shadow-lift);
}
.card-icon{ color:var(--accent); margin-bottom:.5rem; }
.card h2{ margin:0 0 .3rem; font-size:1.08rem; font-weight:800; }
.card p{ margin:0; font-size:.85rem; color:var(--ink-soft); }

.card-coral{ --accent:var(--coral); }
.card-mustard{ --accent:var(--mustard); }
.card-sky{ --accent:var(--sky); }
.card-sage{ --accent:var(--sage); }
.card-lavender{ --accent:var(--lavender); }

/* ---------- detail panel ---------- */
.detail-wrap{ margin:1.5rem 0 2rem; }
.detail-card{
  position:relative;
  background:var(--surface-2);
  border-radius:6px;
  padding:1.8rem 2rem;
  box-shadow:var(--shadow-lift);
  animation:pop .18s ease;
}
@media (prefers-reduced-motion: reduce){ .detail-card{ animation:none; } }
@keyframes pop{ from{ opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

.detail-close{
  position:absolute; top:1rem; right:1rem;
  width:32px;height:32px;
  border-radius:50%;
  border:none;
  background:var(--surface);
  color:var(--ink-soft);
  cursor:pointer;
  font-size:.95rem;
  box-shadow:var(--shadow);
}

<script>
(function(){
  var wrap = document.getElementById('detailWrap');
  var body = document.getElementById('detailBody');
  var closeBtn = document.getElementById('detailClose');
  var cards = document.querySelectorAll('.card[data-target]');
  var chips = document.querySelectorAll('.chip[data-goto]');

  function open(id, sourceEl){
    var tpl = document.getElementById('tpl-' + id);
    if(!tpl) return;
    cards.forEach(function(c){ c.setAttribute('aria-expanded', c.dataset.target === id ? 'true' : 'false'); });
    body.innerHTML = '';
    body.appendChild(tpl.content.cloneNode(true));
    wrap.hidden = false;
    wrap.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'nearest'});
  }
  function close(){
    wrap.hidden = true;
    cards.forEach(function(c){ c.setAttribute('aria-expanded','false'); });
  }

  cards.forEach(function(c){
    c.addEventListener('click', function(){
      if(c.getAttribute('aria-expanded') === 'true'){ close(); }
      else{ open(c.dataset.target, c); }
    });
  });
  chips.forEach(function(c){
    c.addEventListener('click', function(){ open(c.dataset.goto, c); });
  });
  closeBtn.addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
})();
</script>
